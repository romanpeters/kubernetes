apiVersion: apps/v1
kind: Deployment
metadata:
  name: based-meter-api
  labels:
    app.kubernetes.io/name: based-meter-api
    app.kubernetes.io/instance: based-meter-api-prod
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: flux
    exposure: public
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: based-meter-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: based-meter-api
    spec:
      containers:
        - name: api
          image: python:3.15-slim@sha256:94d3426f1def7db4a106a232ac121bfd975393e5dfd40a619b955fae45fe7913
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - /app/server.py
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_PATH
              value: /data/results.db
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: code
          configMap:
            name: based-meter-api
        - name: data
          persistentVolumeClaim:
            claimName: based-meter-api-data
