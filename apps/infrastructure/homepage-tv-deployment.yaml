apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage-tv
  labels:
    app.kubernetes.io/name: homepage-tv
    app.kubernetes.io/instance: homepage-tv-prod
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: flux
    exposure: public
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage-tv
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage-tv
    spec:
      initContainers:
        - name: seed-config
          image: alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mkdir -p /app/config
              cp -a /config-ro/. /app/config/
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: config-ro
              mountPath: /config-ro
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.8.0@sha256:019d8f063a7299e7c1c51ee4a70b692291809af3244894fbec2c2ac7d1f71b18
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Amsterdam"
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "tv.romanpeters.nl,rtv.romanpeters.nl,romantv.romanpeters.nl"
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: config
          emptyDir: {}
        - name: config-ro
          configMap:
            name: homepage-tv-config
