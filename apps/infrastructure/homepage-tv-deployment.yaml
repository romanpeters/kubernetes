apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage-tv
  labels:
    app.kubernetes.io/name: homepage-tv
    app.kubernetes.io/instance: homepage-tv-prod
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: flux
    exposure: public
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage-tv
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage-tv
    spec:
      initContainers:
        - name: seed-config
          image: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mkdir -p /app/config
              cp -a /config-ro/. /app/config/
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: config-ro
              mountPath: /config-ro
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.7.0@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Amsterdam"
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "tv.romanpeters.nl,rtv.romanpeters.nl,romantv.romanpeters.nl"
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: config
          emptyDir: {}
        - name: config-ro
          configMap:
            name: homepage-tv-config
