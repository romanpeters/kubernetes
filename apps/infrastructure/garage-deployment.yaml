apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage
  namespace: infrastructure
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/instance: garage-prod
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: flux
    exposure: public
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage
    spec:
      initContainers:
        - name: init-data-dirs
          image: alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -e
              mkdir -p /var/lib/garage/meta /var/lib/garage/data
          volumeMounts:
            - name: data
              mountPath: /var/lib/garage
      containers:
        - name: garage
          image: dxflrs/garage:v2.6.0@sha256:4b5a318fc9fe2fbec5d3af590eeafe05d83492e6411266fa0b9e215c20264013
          imagePullPolicy: IfNotPresent
          command:
            - /garage
          args:
            - -c
            - /etc/garage/garage.toml
            - server
          ports:
            - name: s3
              containerPort: 3900
            - name: web
              containerPort: 3902
            - name: rpc
              containerPort: 3901
            - name: admin
              containerPort: 3903
          volumeMounts:
            - name: config
              mountPath: /etc/garage/garage.toml
              subPath: garage.toml
              readOnly: true
            - name: secrets
              mountPath: /run/secrets/garage
              readOnly: true
            - name: data
              mountPath: /var/lib/garage
      volumes:
        - name: config
          configMap:
            name: garage-config
        - name: secrets
          secret:
            secretName: garage-secrets
            defaultMode: 0400
        - name: data
          persistentVolumeClaim:
            claimName: garage-data
