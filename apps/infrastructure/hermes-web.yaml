apiVersion: v1
kind: Service
metadata:
  name: hermes-external
  labels:
    app.kubernetes.io/name: hermes-external
    app.kubernetes.io/instance: hermes-external-prod
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: flux
    exposure: internal
spec:
  ports:
    - name: http
      port: 9119
      targetPort: 9119
---
apiVersion: v1
kind: Endpoints
metadata:
  name: hermes-external
  labels:
    app.kubernetes.io/name: hermes-external
    app.kubernetes.io/instance: hermes-external-prod
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: flux
    exposure: internal
subsets:
  - addresses:
      - ip: 10.10.20.30
    ports:
      - name: http
        port: 9119
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes
  # LAN only: websecure-int entrypoint, and deliberately NO external-dns
  # annotation so no public Cloudflare record is created. The dashboard itself
  # enforces username/password auth (dashboard.basic_auth) because Hermes
  # requires an auth provider for any non-loopback bind.
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure-int
  labels:
    app.kubernetes.io/name: hermes
    app.kubernetes.io/instance: hermes-prod
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: flux
    exposure: internal
spec:
  ingressClassName: traefik
  tls:
    - secretName: romanpeters-nl-tls
      hosts:
        - hermes.romanpeters.nl
  rules:
    - host: hermes.romanpeters.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hermes-external
                port:
                  name: http
