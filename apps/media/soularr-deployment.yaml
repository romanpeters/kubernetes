apiVersion: apps/v1
kind: Deployment
metadata:
  name: soularr
  labels:
    app.kubernetes.io/name: soularr
    app.kubernetes.io/instance: soularr-prod
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: flux
    exposure: internal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: soularr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: soularr
    spec:
      containers:
        - name: soularr
          image: mrusse08/soularr:v1.2.3@sha256:e448d49d0ca6091a35653ff9198ebb4a3acf42abfc2f2056490a9a0f0cffd210
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: TZ
              value: Europe/Amsterdam
            # How often the wanted-list is re-read, in seconds.
            - name: SCRIPT_INTERVAL
              value: "1800"
            - name: WEBUI_ENABLED
              value: "false"
          volumeMounts:
            # soularr writes its pagination cursor into /data, so the directory
            # must be writable; only config.ini comes from the secret.
            - name: state
              mountPath: /data
            - name: config
              mountPath: /data/config.ini
              subPath: config.ini
              readOnly: true
            # Same PVC and the same paths as lidarr and slskd see them, so the
            # config's download_dir is literally identical for all three.
            - name: media
              mountPath: /mnt/media
      volumes:
        - name: state
          emptyDir: {}
        - name: config
          secret:
            secretName: soularr-config
        - name: media
          persistentVolumeClaim:
            claimName: media-nfs
