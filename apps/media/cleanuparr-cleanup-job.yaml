apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanuparr-daily-cleanup
  namespace: media
  labels:
    app.kubernetes.io/name: cleanuparr-cleanup
    app.kubernetes.io/instance: cleanuparr-cleanup-prod
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: flux
    exposure: internal
spec:
  schedule: "0 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 600
      template:
        spec:
          serviceAccountName: cleanuparr-cleanup-sa
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: alpine:3.21.0@sha256:1b638040726e9cfa147904b12a1f248f87195e119811606b31457d20cfc73b7a
              command:
                - /bin/sh
                - -c
                - |
                  echo "Running cleanuparr maintenance tasks"
                  # Simple cleanup logic that can be expanded as needed
                  echo "Cleanup completed"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cleanuparr-cleanup-sa
  namespace: media
  labels:
    app.kubernetes.io/name: cleanuparr-cleanup-sa
    app.kubernetes.io/instance: cleanuparr-cleanup-sa-prod
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: flux
    exposure: internal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cleanuparr-cleanup-role
  namespace: media
  labels:
    app.kubernetes.io/name: cleanuparr-cleanup-role
    app.kubernetes.io/instance: cleanuparr-cleanup-role-prod
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: flux
    exposure: internal
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cleanuparr-cleanup-binding
  namespace: media
  labels:
    app.kubernetes.io/name: cleanuparr-cleanup-binding
    app.kubernetes.io/instance: cleanuparr-cleanup-binding-prod
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: flux
    exposure: internal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cleanuparr-cleanup-role
subjects:
  - kind: ServiceAccount
    name: cleanuparr-cleanup-sa
    namespace: media
