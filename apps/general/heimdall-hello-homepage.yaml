apiVersion: v1
kind: ConfigMap
metadata:
  name: heimdall-hello-homepage
  namespace: general
  labels:
    app.kubernetes.io/name: heimdall-hello-homepage
    app.kubernetes.io/instance: heimdall-hello-homepage-prod
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: flux
    exposure: internal
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Roman Peters</title>
        <style>
          :root {
            color-scheme: dark;
            --bg: #07111f;
            --panel: rgba(15, 23, 42, 0.82);
            --panel-border: rgba(148, 163, 184, 0.18);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #7dd3fc;
            --accent-strong: #38bdf8;
            --shadow: rgba(15, 23, 42, 0.35);
          }

          * {
            box-sizing: border-box;
          }

          body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background:
              radial-gradient(circle at top left, rgba(56, 189, 248, 0.22), transparent 32%),
              radial-gradient(circle at top right, rgba(59, 130, 246, 0.16), transparent 28%),
              linear-gradient(135deg, #020617 0%, #0f172a 48%, #111827 100%);
          }

          .shell {
            width: min(1100px, calc(100% - 32px));
            margin: 0 auto;
            padding: 48px 0 56px;
          }

          .hero {
            display: grid;
            gap: 16px;
            margin-bottom: 28px;
            padding: 28px;
            border: 1px solid var(--panel-border);
            border-radius: 28px;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.94), rgba(15, 23, 42, 0.7));
            box-shadow: 0 24px 70px var(--shadow);
            backdrop-filter: blur(16px);
          }

          .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            width: fit-content;
            padding: 8px 14px;
            border-radius: 999px;
            color: var(--accent);
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(125, 211, 252, 0.22);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
          }

          h1 {
            margin: 0;
            font-size: clamp(2.6rem, 6vw, 4.5rem);
            line-height: 1;
            letter-spacing: -0.04em;
          }

          .subtitle {
            max-width: 70ch;
            margin: 0;
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.65;
          }

          .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 14px;
          }

          a.card {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 112px;
            padding: 18px;
            text-decoration: none;
            color: inherit;
            border-radius: 22px;
            border: 1px solid rgba(148, 163, 184, 0.15);
            background: rgba(15, 23, 42, 0.72);
            box-shadow: 0 16px 34px rgba(2, 6, 23, 0.35);
            transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
          }

          a.card:hover {
            transform: translateY(-2px);
            border-color: rgba(125, 211, 252, 0.35);
            background: rgba(15, 23, 42, 0.9);
          }

          .card-name {
            font-size: 1.05rem;
            font-weight: 700;
          }

          .card-url {
            color: var(--muted);
            font-size: 0.92rem;
            word-break: break-word;
          }

          .section {
            margin-top: 28px;
            margin-bottom: 12px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #cbd5e1;
          }

          @media (max-width: 640px) {
            .shell {
              width: min(100% - 20px, 1100px);
              padding: 20px 0 28px;
            }

            .hero {
              padding: 22px;
              border-radius: 22px;
            }
          }
        </style>
      </head>
      <body>
        <main class="shell">
          <section class="hero">
            <div class="eyebrow">Roman Peters</div>
            <h1>Links and services</h1>
            <p class="subtitle">
              This is the public landing page for romanpeters.nl. It redirects here so the top links stay easy to reach.
            </p>
          </section>

          <div class="section">Public</div>
          <section class="grid">
            <a class="card" href="https://hello.romanpeters.nl">
              <div class="card-name">Hello</div>
              <div class="card-url">hello.romanpeters.nl</div>
            </a>
            <a class="card" href="https://homepage.romanpeters.nl">
              <div class="card-name">Homepage</div>
              <div class="card-url">homepage.romanpeters.nl</div>
            </a>
            <a class="card" href="https://git.romanpeters.nl">
              <div class="card-name">Git</div>
              <div class="card-url">git.romanpeters.nl</div>
            </a>
            <a class="card" href="https://chat.romanpeters.nl">
              <div class="card-name">Open WebUI</div>
              <div class="card-url">chat.romanpeters.nl</div>
            </a>
            <a class="card" href="https://recepten.romanpeters.nl">
              <div class="card-name">Mealie</div>
              <div class="card-url">recepten.romanpeters.nl</div>
            </a>
            <a class="card" href="https://books.romanpeters.nl">
              <div class="card-name">Audiobookshelf</div>
              <div class="card-url">books.romanpeters.nl</div>
            </a>
          </section>

          <div class="section">Media</div>
          <section class="grid">
            <a class="card" href="https://plex.romanpeters.nl">
              <div class="card-name">Plex</div>
              <div class="card-url">plex.romanpeters.nl</div>
            </a>
            <a class="card" href="https://jellyfin.romanpeters.nl">
              <div class="card-name">Jellyfin</div>
              <div class="card-url">jellyfin.romanpeters.nl</div>
            </a>
            <a class="card" href="https://request.romanpeters.nl">
              <div class="card-name">Overseerr</div>
              <div class="card-url">request.romanpeters.nl</div>
            </a>
            <a class="card" href="https://sonarr.romanpeters.nl">
              <div class="card-name">Sonarr</div>
              <div class="card-url">sonarr.romanpeters.nl</div>
            </a>
            <a class="card" href="https://radarr.romanpeters.nl">
              <div class="card-name">Radarr</div>
              <div class="card-url">radarr.romanpeters.nl</div>
            </a>
            <a class="card" href="https://bazarr.romanpeters.nl">
              <div class="card-name">Bazarr</div>
              <div class="card-url">bazarr.romanpeters.nl</div>
            </a>
          </section>

          <div class="section">Infrastructure</div>
          <section class="grid">
            <a class="card" href="https://auth.romanpeters.nl">
              <div class="card-name">Authentik</div>
              <div class="card-url">auth.romanpeters.nl</div>
            </a>
            <a class="card" href="https://dashboard.romanpeters.nl">
              <div class="card-name">Grafana</div>
              <div class="card-url">dashboard.romanpeters.nl</div>
            </a>
            <a class="card" href="https://alerts.romanpeters.nl">
              <div class="card-name">Alerts</div>
              <div class="card-url">alerts.romanpeters.nl</div>
            </a>
            <a class="card" href="https://change.romanpeters.nl">
              <div class="card-name">ChangeDetection</div>
              <div class="card-url">change.romanpeters.nl</div>
            </a>
            <a class="card" href="https://ntfy.romanpeters.nl">
              <div class="card-name">ntfy</div>
              <div class="card-url">ntfy.romanpeters.nl</div>
            </a>
            <a class="card" href="https://uptime.romanpeters.nl">
              <div class="card-name">Uptime Kuma</div>
              <div class="card-url">uptime.romanpeters.nl</div>
            </a>
          </section>
        </main>
      </body>
    </html>
