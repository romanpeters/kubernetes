apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  labels:
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/instance: forgejo-prod
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: flux
    exposure: internal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo
    spec:
      tolerations:
        - key: "node.kubernetes.io/unschedulable"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:16.0.5@sha256:cf5f5ae6acf2ababca0ee3d255705b83a47f35b25e07fc931d694d60664053fe
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
            - name: ssh
              containerPort: 22
          env:
            - name: TZ
              value: "Europe/Amsterdam"
            - name: FORGEJO__database__DB_TYPE
              value: postgres
            - name: FORGEJO__database__HOST
              value: forgejo-postgres:5432
            - name: FORGEJO__database__NAME
              value: forgejo
            - name: FORGEJO__database__USER
              value: forgejo
            - name: FORGEJO__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: DB_PASSWORD
            - name: FORGEJO__security__INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: INTERNAL_TOKEN
            - name: FORGEJO__server__DOMAIN
              value: git.romanpeters.nl
            - name: FORGEJO__server__ROOT_URL
              value: https://git.romanpeters.nl/
            - name: FORGEJO__server__SSH_PORT
              value: "22"
            - name: FORGEJO__server__SSH_LISTEN_PORT
              value: "22"
            - name: FORGEJO__server__HTTP_PORT
              value: "3000"
            - name: FORGEJO__server__APP_DATA_PATH
              value: /data
            # Authentik OIDC login. Three things are load-bearing here:
            # - the section separator is a single "__", so the section has to be
            #   written as "oauth2.authentik" - "oauth2__authentik" lands the keys
            #   in [oauth2] as "authentik__*" and they are silently ignored;
            # - Forgejo title-cases the source name, so the auth source is called
            #   "Authentik" and its callback is /user/oauth2/Authentik/callback -
            #   the lookup is case sensitive, and that exact-cased URL is the
            #   redirect URI registered on the Authentik provider;
            # - the client id/secret must be the confidential pair of the
            #   Authentik OAuth2 provider "Provider for Forgejo".
            - name: FORGEJO__oauth2.authentik__ENABLED
              value: "true"
            - name: FORGEJO__oauth2.authentik__DISPLAY_NAME
              value: "Authentik"
            - name: FORGEJO__oauth2.authentik__AUTO_DISCOVER_URL
              value: "https://auth.romanpeters.nl/application/o/forgejo/.well-known/openid-configuration"
            - name: FORGEJO__oauth2.authentik__CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: OAUTH2_AUTHENTIK_CLIENT_ID
            - name: FORGEJO__oauth2.authentik__CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: OAUTH2_AUTHENTIK_CLIENT_SECRET
            - name: FORGEJO__oauth2.authentik__SCOPES
              value: "openid profile email"
            # Goth asks an OIDC provider for "openid" only, and the per-source
            # SCOPES key above does not change that. The profile scope is what
            # carries groups, so without this the required-claim check below
            # would never match.
            - name: FORGEJO__oauth2_client__OPENID_CONNECT_SCOPES
              value: "openid profile email"
            # The profile scope already carries groups as an array of names, and
            # Forgejo turns the claim into a set, so this restricts login to the
            # group that already backs the Authentik app.
            - name: FORGEJO__oauth2.authentik__REQUIRED_CLAIM_NAME
              value: "groups"
            - name: FORGEJO__oauth2.authentik__REQUIRED_CLAIM_VALUE
              value: "forgejo-users"
          volumeMounts:
            - name: forgejo-data
              mountPath: /data
      volumes:
        - name: forgejo-data
          persistentVolumeClaim:
            claimName: forgejo-data
