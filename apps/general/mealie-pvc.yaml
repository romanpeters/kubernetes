apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mealie-data
  namespace: general
  labels:
    app.kubernetes.io/name: mealie-data
    app.kubernetes.io/instance: mealie-data-prod
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: flux
    exposure: public
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
