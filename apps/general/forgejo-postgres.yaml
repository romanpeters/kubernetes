apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-postgres
  labels:
    app.kubernetes.io/name: forgejo-postgres
    app.kubernetes.io/instance: forgejo-postgres-prod
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: flux
    exposure: internal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.7-pg16-trixie@sha256:40d828eda66737aaacb934387a337babf1455ebd56e9bdd13fc08e211257c972
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: forgejo
            - name: POSTGRES_USER
              value: forgejo
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo-postgres
  labels:
    app.kubernetes.io/name: forgejo-postgres
    app.kubernetes.io/instance: forgejo-postgres-prod
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: flux
    exposure: internal
spec:
  selector:
    app.kubernetes.io/name: forgejo-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
