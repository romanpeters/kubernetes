apiVersion: batch/v1
kind: Job
metadata:
  name: heimdall-hello-sync
  namespace: general
  labels:
    app.kubernetes.io/name: heimdall-hello-sync
    app.kubernetes.io/instance: heimdall-hello-sync-prod
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: flux
    exposure: internal
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: heimdall-hello-sync
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: prepare-site
          image: lscr.io/linuxserver/heimdall:v2.7.6-ls337@sha256:adb467b90b825f44d7e4c1764191f4fa0a7c38cff6ff050407f7aeb3514bdbe1
          command:
            - /bin/sh
            - -ceu
            - |
              mkdir -p /work/site
              cp -a /app/www-tmp/public/. /work/site/
              if [ -d /config/www ]; then
                cp -a /config/www/. /work/site/
              fi
          volumeMounts:
            - name: work
              mountPath: /work
            - name: config
              mountPath: /config
      containers:
        - name: s3-sync
          image: public.ecr.aws/aws-cli/aws-cli:2.31.2@sha256:67428f5a530cc8aa415da6d86f3da69ded9f8f764e3a6df3c8bf36585827299e
          command:
            - /bin/sh
            - -ceu
            - |
              aws --endpoint-url http://garage.infrastructure.svc.cluster.local:3900 --region garage s3 sync /work/site s3://hello --delete
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: heimdall-hello-sync-s3
                  key: access_key_id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: heimdall-hello-sync-s3
                  key: secret_access_key
            - name: AWS_DEFAULT_REGION
              value: garage
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir: {}
        - name: config
          persistentVolumeClaim:
            claimName: heimdall-config
