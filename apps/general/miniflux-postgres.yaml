apiVersion: apps/v1
kind: Deployment
metadata:
  name: miniflux-postgres
  labels:
    app.kubernetes.io/name: miniflux-postgres
    app.kubernetes.io/instance: miniflux-postgres-prod
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: flux
    exposure: internal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: miniflux-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: miniflux-postgres
        app.kubernetes.io/instance: miniflux-postgres-prod
        app.kubernetes.io/part-of: homelab
        app.kubernetes.io/managed-by: flux
        exposure: internal
    spec:
      containers:
        - name: postgres
          image: postgres:18.6-alpine3.23@sha256:1a0c23d53c1ad77468c8653fa6eed4f4105cfbef9e6f027bc1dfeb16949a8c29
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: miniflux
            - name: POSTGRES_USER
              value: miniflux
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: miniflux-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: miniflux-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: miniflux-postgres
  labels:
    app.kubernetes.io/name: miniflux-postgres
    app.kubernetes.io/instance: miniflux-postgres-prod
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: flux
    exposure: internal
spec:
  selector:
    app.kubernetes.io/name: miniflux-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
