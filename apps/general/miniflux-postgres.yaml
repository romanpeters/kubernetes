apiVersion: apps/v1
kind: Deployment
metadata:
  name: miniflux-postgres
  labels:
    app.kubernetes.io/name: miniflux-postgres
    app.kubernetes.io/instance: miniflux-postgres-prod
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: flux
    exposure: internal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: miniflux-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: miniflux-postgres
        app.kubernetes.io/instance: miniflux-postgres-prod
        app.kubernetes.io/part-of: homelab
        app.kubernetes.io/managed-by: flux
        exposure: internal
    spec:
      containers:
        - name: postgres
          image: postgres:18.7-alpine3.23@sha256:e6014245dccbc0f28b07dac8e3f793c94a18420f78690e9db547957514a524f1
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: miniflux
            - name: POSTGRES_USER
              value: miniflux
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: miniflux-secrets
                  key: DB_PASSWORD
          volumeMounts:
            # postgres:18 moved its default PGDATA to /var/lib/postgresql/18/docker,
            # so the volume has to cover /var/lib/postgresql (not .../data).
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: miniflux-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: miniflux-postgres
  labels:
    app.kubernetes.io/name: miniflux-postgres
    app.kubernetes.io/instance: miniflux-postgres-prod
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: flux
    exposure: internal
spec:
  selector:
    app.kubernetes.io/name: miniflux-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
