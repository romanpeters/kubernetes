apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-postgres
  labels:
    app.kubernetes.io/name: gitea-postgres
    app.kubernetes.io/instance: gitea-postgres-prod
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: flux
    exposure: internal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea-postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.2-pg16-trixie@sha256:fc843a8547e0e4e84337a585aef2a28621db9e9f2fd1aaf8e72fedb04d19b40d
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: gitea
            - name: POSTGRES_USER
              value: gitea
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitea-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-postgres
  labels:
    app.kubernetes.io/name: gitea-postgres
    app.kubernetes.io/instance: gitea-postgres-prod
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: flux
    exposure: internal
spec:
  selector:
    app.kubernetes.io/name: gitea-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
