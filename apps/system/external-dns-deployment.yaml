apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
  labels:
    app.kubernetes.io/name: external-dns
    app.kubernetes.io/instance: external-dns-prod
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: flux
    exposure: internal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns
    spec:
      serviceAccountName: external-dns
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.24.0@sha256:a80a146d2540fa138565e404f0625157271071a06093021f27ae19d8316d10f9
          imagePullPolicy: IfNotPresent
          args:
            - --source=ingress
            - --source=traefik-proxy
            - --provider=cloudflare
            - --domain-filter=romanpeters.nl
            - --annotation-filter=external-dns=external
            - --registry=txt
            - --txt-owner-id=romanpeters-k3s
            - --txt-prefix=external-dns-
            - --policy=sync
            - --cloudflare-proxied
            - --default-targets=$(EDGE_HOSTNAME)
            - --force-default-targets
            - --interval=1m
            - --log-level=info
          env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: external-dns
                  key: CF_API_TOKEN
            - name: EDGE_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: cloudflare-ddns
                  key: EDGE_HOSTNAME
