apiVersion: batch/v1
kind: CronJob
metadata:
  name: cloudflare-ddns
  namespace: external-dns
  labels:
    app.kubernetes.io/name: cloudflare-ddns
    app.kubernetes.io/instance: cloudflare-ddns-prod
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: flux
    exposure: internal
    app.kubernetes.io/component: dns
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cloudflare-ddns
            app.kubernetes.io/instance: cloudflare-ddns-prod
            app.kubernetes.io/part-of: homelab
            app.kubernetes.io/managed-by: flux
            exposure: internal
            app.kubernetes.io/component: dns
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cloudflare-ddns
              image: python:3.14.3-alpine3.22@sha256:b0d9cd5ed77285b2563c86ca10b53578249ca1a08d14e5b69b7970884a9fb539
              imagePullPolicy: IfNotPresent
              command:
                - python
                - /scripts/ddns.py
              env:
                - name: CF_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: external-dns
                      key: CF_API_TOKEN
                - name: CF_ZONE_NAME
                  value: "romanpeters.nl"
                - name: CF_RECORD_NAME
                  valueFrom:
                    secretKeyRef:
                      name: cloudflare-ddns
                      key: EDGE_HOSTNAME
                - name: CF_TTL
                  value: "1"
                - name: CF_PROXIED
                  value: "false"
              volumeMounts:
                - name: script
                  mountPath: /scripts
          volumes:
            - name: script
              configMap:
                name: cloudflare-ddns
                defaultMode: 0755
