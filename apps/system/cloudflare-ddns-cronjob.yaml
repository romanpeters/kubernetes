apiVersion: batch/v1
kind: CronJob
metadata:
  name: cloudflare-ddns
  namespace: external-dns
  labels:
    app.kubernetes.io/name: cloudflare-ddns
    app.kubernetes.io/instance: cloudflare-ddns-prod
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: flux
    exposure: internal
    app.kubernetes.io/component: dns
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cloudflare-ddns
            app.kubernetes.io/instance: cloudflare-ddns-prod
            app.kubernetes.io/part-of: homelab
            app.kubernetes.io/managed-by: flux
            exposure: internal
            app.kubernetes.io/component: dns
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cloudflare-ddns
              image: python:3.14.5-alpine3.22@sha256:6b91e66ab2a880ce9ca5a1b91c70f45963ff71ff68268df056336e1a657d5efd
              imagePullPolicy: IfNotPresent
              command:
                - python
                - /scripts/ddns.py
              env:
                - name: CF_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: external-dns
                      key: CF_API_TOKEN
                - name: CF_ZONE_NAME
                  value: "romanpeters.nl"
                - name: CF_RECORDS
                  value: "edge.romanpeters.nl:false,romanpeters.nl:true"
                - name: CF_TTL
                  value: "1"
              volumeMounts:
                - name: script
                  mountPath: /scripts
          volumes:
            - name: script
              configMap:
                name: cloudflare-ddns
                defaultMode: 0755
