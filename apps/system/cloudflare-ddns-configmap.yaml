apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflare-ddns
  namespace: external-dns
  labels:
    app.kubernetes.io/name: cloudflare-ddns
    app.kubernetes.io/instance: cloudflare-ddns-prod
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: flux
    exposure: internal
    app.kubernetes.io/component: dns
  annotations:
    description: "Updates edge.romanpeters.nl A record to current public IP"
data:
  ddns.py: |
    #!/usr/bin/env python3
    import json
    import os
    import sys
    import urllib.request

    CF_API_TOKEN = os.environ.get("CF_API_TOKEN")
    if not CF_API_TOKEN:
      print("CF_API_TOKEN missing", file=sys.stderr)
      sys.exit(1)

    zone_name = os.environ.get("CF_ZONE_NAME", "romanpeters.nl")
    record_name = os.environ.get("CF_RECORD_NAME", "edge.romanpeters.nl")
    proxied = os.environ.get("CF_PROXIED", "true").lower() == "true"
    ttl = int(os.environ.get("CF_TTL", "1"))

    def http_json(method, url, data=None):
      req = urllib.request.Request(url, method=method)
      req.add_header("Authorization", f"Bearer {CF_API_TOKEN}")
      req.add_header("Content-Type", "application/json")
      if data is not None:
        payload = json.dumps(data).encode("utf-8")
        req.data = payload
      with urllib.request.urlopen(req, timeout=10) as resp:
        body = resp.read().decode("utf-8")
        return json.loads(body)

    def get_public_ip():
      with urllib.request.urlopen("https://api.ipify.org", timeout=10) as resp:
        return resp.read().decode("utf-8").strip()

    try:
      public_ip = get_public_ip()
    except Exception as exc:
      print(f"Failed to get public IP: {exc}", file=sys.stderr)
      sys.exit(1)

    zones = http_json("GET", f"https://api.cloudflare.com/client/v4/zones?name={zone_name}")
    if not zones.get("success") or not zones.get("result"):
      print(f"Zone not found: {zone_name}", file=sys.stderr)
      sys.exit(1)
    zone_id = zones["result"][0]["id"]

    records = http_json(
      "GET",
      f"https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records?type=A&name={record_name}",
    )
    if not records.get("success"):
      print("Failed to query DNS records", file=sys.stderr)
      sys.exit(1)

    record = records["result"][0] if records["result"] else None

    desired = {
      "type": "A",
      "name": record_name,
      "content": public_ip,
      "ttl": ttl,
      "proxied": proxied,
    }

    if record:
      if (
        record.get("content") == public_ip
        and record.get("proxied") == proxied
        and int(record.get("ttl")) == ttl
      ):
        print(f"{record_name} already up to date ({public_ip})")
        sys.exit(0)

      record_id = record["id"]
      result = http_json(
        "PUT",
        f"https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records/{record_id}",
        desired,
      )
      if not result.get("success"):
        print(f"Failed to update {record_name}: {result}", file=sys.stderr)
        sys.exit(1)
      print(f"Updated {record_name} -> {public_ip}")
    else:
      result = http_json(
        "POST",
        f"https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records",
        desired,
      )
      if not result.get("success"):
        print(f"Failed to create {record_name}: {result}", file=sys.stderr)
        sys.exit(1)
      print(f"Created {record_name} -> {public_ip}")
