name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install yamllint pre-commit

          go install sigs.k8s.io/kustomize/kustomize/v5@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          go install github.com/google/yamlfmt/cmd/yamlfmt@v0.9.0

          mkdir -p "$HOME/bin"
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Pre-commit
        run: pre-commit run --all-files
      - name: Disallow floating latest image tags
        run: ./scripts/check-no-floating-latest.sh
      - name: Require baseline Kubernetes labels
        run: ./scripts/check-required-labels.sh
      - name: Block public exposure of internal resources
        run: ./scripts/check-internal-not-exposed.sh
      - name: Enforce LAN-only protection on websecure-int
        run: ./scripts/check-websecure-int-lan-only.sh
      - name: Validate manifests
        run: ./scripts/validate.sh
